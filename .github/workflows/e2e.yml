name: E2E Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Run copies of the current job in parallel
        group: [home-pages, talks, speakers]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Cypress Run
        uses: cypress-io/github-action@v7
        with:
          build: npm run build
          start: npm start
          wait-on: "http://localhost:3000"
          # Map matrix groups to spec files
          spec: |
            ${{ 
              matrix.group == 'home-pages' && 'cypress/e2e/home/**/*.cy.ts' ||
              matrix.group == 'talks' && 'cypress/e2e/talks/**/*.cy.ts' ||
              matrix.group == 'speakers' && 'cypress/e2e/speakers/**/*.cy.ts'
            }}
